trigger:
  branches:
    include: [main, develop]
  paths:
    include:
      - src/ProductService/**
      - tests/ProductService.Tests/**
      - deploy/helm/**
      - pipelines/**

# resources: # reference another git repo - which has the master pipeline templates that each application repo can reference
#   repositories:
#     - repository: pipeline-templates
#       type: git
#       name: pipeline-templates
#       ref: refs/heads/master      

parameters:
- name: targetEnvironment
  type: string
  default: dev
  values: [dev, test, prod]
- name: deploy
  type: boolean
  default: true

stages:
#- template: templates/test-dotnet.yaml@pipeline-templates #refe the template from master pipeline-template repo
- template: templates/test-dotnet.yaml
  parameters:
    serviceName: product-service
    testProjectPath: tests/ProductService.Tests/ProductService.Tests.csproj

#- template: templates/build-dotnet.yaml@pipeline-templates #refe the template from master pipeline-template repo
- template: templates/build-dotnet.yaml
  parameters:
    serviceName: product-service
    projectPath: src/ProductService/ProductService.csproj
    dockerfilePath: src/ProductService/Dockerfile
    dependsOn: Test_product_service

- ${{ if eq(parameters.deploy, true) }}:
  #- template: templates/deploy.yaml@pipeline-templates #refe the template from master pipeline-template repo
  - template: templates/deploy.yaml
    parameters:
      serviceName: product-service
      environment: ${{ parameters.targetEnvironment }}
      valuesFile: deploy/helm/product-values.yaml
      dependsOn: Build_product_service
