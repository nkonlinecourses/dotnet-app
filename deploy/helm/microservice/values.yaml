nameOverride: ""
replicaCount: 1
image:
  repository: example.azurecr.io/product-service
  tag: latest
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 80
  targetPort: 8080
env: []
ingress:
  enabled: false
  className: nginx
  host: demo.local
  path: /
  pathType: Prefix
resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: 500m, memory: 256Mi }

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
