apiVersion: v1
kind: ServiceAccount
metadata:
  name: test-app-agentpool-sa
  namespace: {{ .Release.Namespace }}
  annotations:
    azure.workload.identity/client-id: {{ .Values.serviceAccountClientId }} #client id of aks workload identity
---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: test-app-agentpool-sa
  namespace: {{ .Release.Namespace }}
rules:
- apiGroups: ["", "extensions", "apps", "batch", "spv.no", "networking.k8s.io"]
  resources: ["deployments", "pods", "services", "secrets", "namespaces", "statefulsets", "daemonsets", "replicasets", "pods/log", "jobs", "cronjobs", "pods/exec", "configmaps", "ingresses"]
  verbs: ["*"]
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: test-app-agentpool-sa
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: test-app-agentpool-sa
subjects:
- kind: ServiceAccount
  namespace: {{ .Release.Namespace }}
  name: test-app-agentpool-sa
---
apiVersion: v1
kind: Secret
metadata:
  name: test-app-agentpool-sa-secret
  namespace: test-app
  annotations:
    kubernetes.io/service-account.name: test-app-agentpool-sa
type: kubernetes.io/service-account-token